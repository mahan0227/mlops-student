name: mlops-online

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mlops:
    runs-on: ubuntu-latest
    env:
      ROWS: "5000"
      SEED: "42"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Generate synthetic data
        run: |
          python scripts/generate_synthetic_data.py --rows "${ROWS}" --seed "${SEED}" --out data/raw.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/raw.csv")
          print("RAW COLUMNS", df.columns.tolist())
          print(df[["customer_id", "email", "phone"]].head(3).to_string())
          print("rows", len(df), "fraud_rate", round(float(df.fraud.mean()), 4))
          PY

      - name: Data prep (drop PII)
        run: |
          python src/data_prep.py --input data/raw.csv --output data/clean.csv
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/clean.csv")
          print("CLEAN COLUMNS", df.columns.tolist())
          for banned in ("customer_id", "email", "phone"):
              if banned in df.columns:
                  raise SystemExit(f"PII column still present: {banned}")
          print("PII columns are gone.")
          PY

      - name: Train model
        run: |
          rm -rf artifacts/*
          python src/train.py --train data/clean.csv --out artifacts --seed "${SEED}"
          echo "----- metrics.json -----"
          cat artifacts/metrics.json
          echo
          echo "----- metadata.json -----"
          cat artifacts/metadata.json

      - name: Unit tests
        run: pytest -q

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-bundle
          path: artifacts/

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "${IMAGE}:run-${{ github.run_id }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:run-${{ github.run_id }}"
          docker push "${IMAGE}:latest"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "TAG=run-${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with: docker pull ${IMAGE}:latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Make image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "/user/packages/container/${{ github.event.repository.name }}" \
            -f visibility=public || true
